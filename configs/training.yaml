
training:
  seed: 42
  device: auto
  epochs: 50
  batch_size: 32
  num_workers: 0

  loss:
    name: BCEWithLogitsLoss

  optimizer:
    name: AdamW
    learning_rate: 0.001
    weight_decay: 0.0001

  scheduler:
    name: ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 4
    min_lr: 0.000001

  early_stopping:
    enabled: true
    monitor: val_macro_f1
    patience: 10
    min_delta: 0.001

  checkpoint:
    directory: artifacts/checkpoints
    save_best_only: true

  evaluation:
    threshold: 0.5
    metrics:
      - macro_f1
      - micro_f1
      - per_class_f1
      - auroc
      - auprc

  reproducibility:
    deterministic: true

  experiment_tracking:
    enabled: true
    backend: mlflow
    tracking_uri: sqlite:///mlflow.db
    experiment_name: cardiosignal-ptbxl